[project]
name = "triagekit-ml"
version = "0.1.0"
description = "Validation, snapshots, training, evaluation, scoring and routing for triagekit"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
  "scikit-learn==1.9.1",
  "numpy==2.5.3",
  "mlflow==3.16.0",
  "joblib==1.6.0",
  "anthropic==1.5.0",
]

[project.scripts]
triagekit = "triagekit.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
# transformer encoders; excluded from the CPU docker image with --no-group encoders
encoders = ["torch==2.13.0", "transformers==5.14.1"]

[tool.uv]
default-groups = ["dev", "encoders"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triagekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
